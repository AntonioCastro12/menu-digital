<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ea580c'><path d='M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Menú digital interactivo para restaurantes, bares y cafeterías. Consulta platillos, precios y promociones en tiempo real." />
    <meta name="theme-color" content="#ea580c" />
    <title>Menú Digital</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Anti-Netlify-Badge pre-emptive suppression -->
    <script>
      try {
        localStorage.setItem('nl-hud:public:v1', 'hidden:' + (Date.now() + 315360000000));
        localStorage.setItem('nl-hud:owner-private:v1', 'hidden');
      } catch (e) {}

      (function() {
        function purgeNetlifyFrames() {
          const els = document.querySelectorAll('iframe[title="Powered by Netlify"], iframe[id*="nl-"], #nl-badge-frame:not(div)');
          els.forEach(el => el.remove());
        }
        if (typeof MutationObserver !== 'undefined') {
          new MutationObserver(purgeNetlifyFrames).observe(document.documentElement, { childList: true, subtree: true });
        }
        window.addEventListener('load', purgeNetlifyFrames);
      })();
    </script>
    <style>
      #nl-badge-frame,
      #nl-hud-frame,
      iframe[title="Powered by Netlify"],
      iframe[id^="nl-"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        clip-path: path("M0 0Z") !important;
        width: 0 !important;
        height: 0 !important;
        position: fixed !important;
        bottom: -9999px !important;
        right: -9999px !important;
        z-index: -999999 !important;
      }
    </style>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased selection:bg-orange-500 selection:text-white min-h-screen">
    <!-- Decoy element to trigger Netlify HUD script early exit -->
    <div id="nl-badge-frame" style="display:none!important;width:0!important;height:0!important;position:fixed!important;bottom:-9999px!important;right:-9999px!important;opacity:0!important;pointer-events:none!important;" aria-hidden="true"></div>
    <div id="nl-hud-frame" style="display:none!important;width:0!important;height:0!important;position:fixed!important;bottom:-9999px!important;right:-9999px!important;opacity:0!important;pointer-events:none!important;" aria-hidden="true"></div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
